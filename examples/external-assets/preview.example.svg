      <stop offset="0" stop-color="#68b6b0"/>
      <stop offset="1" stop-color="#2b606f"/>
    </linearGradient>
    <clipPath id="rounded"><rect width="640" height="400" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#rounded)">
    <rect width="640" height="400" fill="url(#sky)"/>
    <circle cx="485" cy="96" r="37" fill="#fff3d7"/>
    <g fill="#f0e9ff">
