<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="title description">
  <title id="title">ComfyUI external preview format example</title>
  <desc id="description">An original neutral vector landscape with a lavender sky, moon and layered teal hills. Documentation placeholder only; no production image is included.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop offset="0" stop-color="#34314f"/>
      <stop offset="1" stop-color="#a7a0d9"/>
    </linearGradient>
